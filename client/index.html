<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico?v=2026-6" sizes="any" />
    <link rel="icon" type="image/png" href="/icon-192.png?v=2026-6" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2026-6" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Prode Mundial 2026" />
    <meta name="description" content="Prode Mundial 2026 - Plataforma de pronósticos deportivos para el Mundial. Competí con amigos." />
    <script>
      (function () {
        var reloadKey = "prode:stale-asset-reload";
        var staleAssetPattern =
          /bad-precaching-response|Failed to fetch dynamically imported module|Importing a module script failed|Loading chunk|\/assets\/.*\.(js|css)/i;

        function reloadOnce() {
          try {
            if (sessionStorage.getItem(reloadKey) === "1") return;
            sessionStorage.setItem(reloadKey, "1");
          } catch (_) {
            return;
          }
          window.location.reload();
        }

        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            var url = (target && (target.src || target.href)) || event.message || "";
            if (staleAssetPattern.test(String(url))) reloadOnce();
          },
          true,
        );

        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason;
          var message = (reason && (reason.message || reason.toString())) || "";
          if (staleAssetPattern.test(message)) reloadOnce();
        });
      })();
    </script>
    <title>Prode Mundial 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
